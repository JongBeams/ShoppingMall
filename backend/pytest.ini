[pytest]
# Pytest 설정 파일

# 테스트 디렉토리
testpaths = tests

# 파이썬 파일 패턴
python_files = test_*.py

# 테스트 함수 패턴
python_functions = test_*

# 테스트 클래스 패턴
python_classes = Test*

# 마커 등록
markers =
    asyncio: 비동기 테스트
    unit: 단위 테스트
    integration: 통합 테스트
    slow: 실행 시간이 긴 테스트

# 출력 옵션
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 비동기 테스트 모드
asyncio_mode = auto

# 커버리지 설정 (pytest-cov 설치 시)
# addopts += --cov=app --cov-report=html --cov-report=term
